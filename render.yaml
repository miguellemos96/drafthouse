# Render Blueprint: one free web service in Frankfurt. Spec: https://render.com/docs/blueprint-spec
# The Node version comes from `.node-version`.
services:
  - type: web
    name: drafthouse
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    # Deploy on every commit to the linked branch. Same as the deprecated `autoDeploy: true`.
    autoDeployTrigger: commit
    envVars:
      # The visitor IP for the rate limit: Render's proxy sets this header, and a client can't fake it.
      - key: CLIENT_IP_HEADER
        value: true-client-ip
