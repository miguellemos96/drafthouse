<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DraftHouse</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f4f4f2; }
      #view { position: fixed; inset: 0; }
      #language { position: fixed; top: 12px; right: 12px; z-index: 1; font: inherit; padding: 4px 6px; }
      #view-toggle { position: fixed; top: 12px; left: 12px; z-index: 1; font: inherit; padding: 4px 10px; }
      #file-buttons { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: calc(100% - 32px); }
      #file-buttons button { font: inherit; padding: 4px 10px; }
      #history { position: fixed; top: 52px; left: 12px; z-index: 1; display: flex; gap: 8px; }
      #history button { font: inherit; padding: 4px 10px; }
      #versions { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 1; display: grid; gap: 6px; width: 300px; max-width: calc(100vw - 24px); box-sizing: border-box; padding: 8px 10px; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 6px; }
      #versions label, #versions .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #versions select, #versions input { font: inherit; flex: 1; min-width: 0; padding: 2px 4px; }
      #versions input[aria-invalid="true"] { border-color: #c0392b; }
      #versions form { display: grid; gap: 6px; margin: 0; }
      #versions .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
      #versions button { font: inherit; padding: 4px 10px; }
      #version-confirm { display: grid; gap: 6px; padding: 6px 8px; background: #fff3cd; border: 1px solid #e0c36c; border-radius: 4px; }
      #version-confirm p { margin: 0; }
      #versions [hidden], #versions .buttons[hidden] { display: none; }
      #snap-toggle { position: fixed; top: 92px; left: 12px; z-index: 1; font: inherit; padding: 4px 10px; }
      #snap-toggle[aria-pressed="true"] { background: #2f80ed; color: #fff; border: 1px solid #1d5fbf; border-radius: 3px; }
      #file-message { flex-basis: 100%; margin: 0; padding: 6px 10px; background: #fff3cd; border: 1px solid #e0c36c; border-radius: 4px; text-align: center; }
      #add-room { position: fixed; left: 12px; bottom: 12px; z-index: 1; display: grid; gap: 6px; width: 220px; max-width: calc(100% - 48px); padding: 10px 12px; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 6px; }
      #add-room h2 { margin: 0; font-size: 1rem; }
      #add-room label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #add-room input { font: inherit; width: 110px; padding: 2px 4px; }
      #add-room input[aria-invalid="true"] { border-color: #c0392b; }
      #add-room button { font: inherit; padding: 4px 10px; }
      #add-room-message { margin: 0; padding: 6px 8px; background: #fff3cd; border: 1px solid #e0c36c; border-radius: 4px; }
      #add-item { position: fixed; right: 12px; bottom: 12px; z-index: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; max-width: calc(100% - 48px); }
      #add-item > button { font: inherit; padding: 4px 10px; }
      #item-form { display: grid; gap: 6px; width: 240px; max-width: 100%; max-height: calc(100vh - 150px); overflow-y: auto; box-sizing: border-box; padding: 10px 12px; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 6px; }
      #item-form[hidden] { display: none; }
      #item-form h2 { margin: 0; font-size: 1rem; }
      #item-form label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #item-form input, #item-form select { font: inherit; width: 120px; padding: 2px 4px; box-sizing: border-box; }
      #item-form input[type="color"] { height: 28px; padding: 0 2px; }
      #item-form input[aria-invalid="true"] { border-color: #c0392b; }
      #item-form .buttons { display: flex; gap: 8px; }
      #item-form button { font: inherit; padding: 4px 10px; }
      #item-form-message { margin: 0; padding: 6px 8px; background: #fff3cd; border: 1px solid #e0c36c; border-radius: 4px; }
      #item-form-message[hidden] { display: none; }
      #item-form [hidden] { display: none; }
      #item-form-link-message { margin: 0; padding: 6px 8px; background: #fff3cd; border: 1px solid #e0c36c; border-radius: 4px; }
      #item-form-chips { margin: 0; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; display: flex; flex-wrap: wrap; gap: 6px; }
      #item-form-chips legend { padding: 0 4px; font-size: 0.9rem; }
      #item-form-chips label.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 8px; background: #eef2f7; border: 1px solid #b8c4d4; border-radius: 12px; }
      #item-form-chips select { width: auto; }
      #item-form label.confirm { justify-content: flex-start; }
      #item-form label.confirm input { width: auto; }
      #item-form button:disabled { opacity: 0.6; }
      #add-from-link { display: flex; gap: 6px; }
      #add-from-link input { font: inherit; width: 220px; max-width: calc(100vw - 200px); padding: 2px 4px; }
      #add-from-link button { font: inherit; padding: 4px 10px; }
      #item-panel { position: fixed; top: 52px; right: 12px; z-index: 1; display: grid; gap: 6px; width: 260px; max-width: calc(100vw - 24px); max-height: calc(100vh - 70px); overflow-y: auto; box-sizing: border-box; padding: 10px 12px; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 6px; }
      #item-panel[hidden], #item-panel [hidden] { display: none; }
      #item-panel label { white-space: nowrap; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #item-panel input { font: inherit; width: 130px; padding: 2px 4px; box-sizing: border-box; }
      #item-panel input[type="color"] { height: 28px; padding: 0 2px; }
      #item-panel input[aria-invalid="true"] { border-color: #c0392b; }
      #item-panel-message { margin: 0; padding: 6px 8px; background: #fff3cd; border: 1px solid #e0c36c; border-radius: 4px; }
      #item-clashes { margin: 0; padding: 6px 8px 6px 24px; background: #fde8e8; border: 1px solid #e0242a; border-radius: 4px; color: #8a1116; }
      #item-panel .buttons { display: flex; gap: 8px; }
      #item-panel button { font: inherit; padding: 4px 10px; }
      #item-panel h2 { margin: 0; font-size: 1rem; }
      #view-only-note { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 1; margin: 0; padding: 6px 12px; max-width: calc(100% - 48px); box-sizing: border-box; text-align: center; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 6px; }
      #item-panel img { width: 100%; max-height: 140px; object-fit: contain; background: #fff; border-radius: 4px; }
      #tape-measure { position: fixed; top: 132px; left: 12px; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: calc(100% - 24px); }
      #tape-measure button { font: inherit; padding: 4px 10px; }
      #tape-measure button[aria-pressed="true"] { background: #c0392b; color: #fff; border-color: #c0392b; }
      #tape-measure-hint { position: absolute; left: 100%; top: 0; margin: 0 0 0 8px; white-space: nowrap; padding: 4px 8px; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
      #tape-measure-hint[hidden] { display: none; }
      #measures { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .measure-label { position: absolute; transform: translate(-50%, -50%); padding: 1px 5px; background: rgba(255, 255, 255, 0.92); border: 1px solid #2f80ed; border-radius: 3px; font-size: 0.8rem; white-space: nowrap; }
      .measure-label[data-kind="item"] { border-color: #d9822b; }
      .measure-label[data-kind="tape"] { border-color: #c0392b; font-weight: 600; }
      .measure-label[hidden] { display: none; }
      #opening-tools { position: fixed; top: 172px; left: 12px; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; max-width: 260px; }
      #opening-tools[hidden], #opening-tools [hidden] { display: none; }
      #opening-tools button { font: inherit; padding: 4px 10px; }
      #opening-tools button[aria-pressed="true"] { background: #2f80ed; color: #fff; border-color: #2f80ed; }
      #opening-hint { flex-basis: 100%; margin: 0; padding: 6px 8px; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 4px; }
      #draw-room { position: fixed; top: 252px; left: 12px; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 320px; }
      #draw-room button { font: inherit; padding: 4px 10px; }
      #draw-room button[aria-pressed="true"] { background: #2f80ed; color: #fff; border-color: #2f80ed; }
      #draw-room-hint, #draw-room-message { margin: 0; padding: 6px 8px; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
      #draw-room-message { background: #fff3cd; border-color: #e0c36c; }
      #draw-room [hidden] { display: none; }
      .measure-label[data-kind="sketch"] { font-weight: 600; }
      #opening-panel { position: fixed; top: 52px; right: 12px; z-index: 1; display: grid; gap: 6px; width: 260px; max-width: calc(100vw - 24px); box-sizing: border-box; padding: 10px 12px; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 6px; }
      #opening-panel[hidden], #opening-panel [hidden] { display: none; }
      #opening-panel h2 { margin: 0; font-size: 1rem; }
      #opening-panel label { white-space: nowrap; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #opening-panel input { font: inherit; width: 90px; padding: 2px 4px; box-sizing: border-box; }
      #opening-panel input[aria-invalid="true"] { border-color: #c0392b; }
      #opening-panel-message { margin: 0; padding: 6px 8px; background: #fff3cd; border: 1px solid #e0c36c; border-radius: 4px; }
      #opening-panel .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
      #opening-panel button { font: inherit; padding: 4px 10px; }
      #room-panel { position: fixed; top: 52px; right: 12px; z-index: 1; display: grid; gap: 6px; width: 220px; max-width: calc(100% - 48px); padding: 10px 12px; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 6px; }
      #room-panel[hidden], #room-panel [hidden] { display: none; }
      #room-panel h2 { margin: 0; font-size: 1rem; }
      #room-panel label, #room-panel .area { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0; }
      #room-panel input { font: inherit; width: 110px; padding: 2px 4px; box-sizing: border-box; }
      #room-panel input[aria-invalid="true"] { border-color: #c0392b; }
      #room-panel button { font: inherit; padding: 4px 10px; }
      #room-panel-message, #room-panel-confirm { margin: 0; padding: 6px 8px; background: #fff3cd; border: 1px solid #e0c36c; border-radius: 4px; }
      #room-panel-confirm p { margin: 0 0 6px; }
      #room-panel .buttons { display: flex; gap: 8px; }
      #rooms-list { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 1; width: 240px; max-width: calc(100vw - 24px); max-height: calc(100vh - 200px); overflow-y: auto; box-sizing: border-box; padding: 6px 10px; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 6px; }
      #view-only-note ~ #rooms-list { bottom: 64px; }
      #rooms-list summary { cursor: pointer; font-weight: 600; }
      #rooms-list ul { list-style: none; margin: 6px 0; padding: 0; display: grid; gap: 4px; }
      #rooms-list li { display: flex; align-items: center; gap: 6px; }
      #rooms-list li.hidden-room .name { opacity: 0.55; }
      #rooms-list button { font: inherit; padding: 2px 8px; }
      #rooms-list .eye { width: 36px; }
      #rooms-list .name { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #rooms-list .empty { margin: 6px 0; }
      #rooms-list [hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
