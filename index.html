<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DraftHouse</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f4f4f2; }
      #view { position: fixed; inset: 0; }
      #language { position: fixed; top: 12px; right: 12px; z-index: 1; font: inherit; padding: 4px 6px; }
      #view-toggle { position: fixed; top: 12px; left: 12px; z-index: 1; font: inherit; padding: 4px 10px; }
      #file-buttons { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: calc(100% - 32px); }
      #file-buttons button { font: inherit; padding: 4px 10px; }
      #file-message { flex-basis: 100%; margin: 0; padding: 6px 10px; background: #fff3cd; border: 1px solid #e0c36c; border-radius: 4px; text-align: center; }
      #add-room { position: fixed; left: 12px; bottom: 12px; z-index: 1; display: grid; gap: 6px; width: 220px; max-width: calc(100% - 48px); padding: 10px 12px; background: rgba(255, 255, 255, 0.92); border: 1px solid #ccc; border-radius: 6px; }
      #add-room h2 { margin: 0; font-size: 1rem; }
      #add-room label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #add-room input { font: inherit; width: 110px; padding: 2px 4px; }
      #add-room input[aria-invalid="true"] { border-color: #c0392b; }
      #add-room button { font: inherit; padding: 4px 10px; }
      #add-room-message { margin: 0; padding: 6px 8px; background: #fff3cd; border: 1px solid #e0c36c; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
